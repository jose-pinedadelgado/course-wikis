site_name: "IS480 — Advanced Database Management (Zensical)"
site_description: "Course wiki for IS480 Advanced Database Management at CSULB"
site_author: "Jose Pineda"
site_url: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - "Week 1-2: Intro to Oracle PL/SQL":
    - Overview: modules/intro-plsql.md
    - Activity: modules/activity-intro-plsql.md
  - "Week 3: Logic & Conditionals":
    - Functions, Procedures & Conditionals: modules/functions-procedures.md
    - Activity: modules/activity-conditionals.md
    - "Lab 1 Solutions: Conditionals & Loops": modules/lab1-solutions.md
  - "Week 4: SQL in PL/SQL":
    - SQL in PL/SQL: modules/sql-in-plsql.md
    - Exercises: modules/sql-in-plsql-exercises.md
    - "Lab 2 Solutions: FOR Loops & SQL": modules/lab2-solutions.md
  - "Week 5: Cursors":
    - PL/SQL Cursors: modules/cursors.md
    - Cursor Exercises: modules/cursor-exercises.md
    - "Lab 3 Solutions: SQL in PL/SQL & Cursors": modules/lab3-solutions.md
  - "Week 6-7: Exceptions & Packages":
    - "Lab 4 Solutions: Packages & Exceptions": modules/lab4-solutions.md
  - "Week 8-9: Midterm & Project Kickoff":
    - "📝 Midterm Study Guide": study-guide.md
  - "Week 10-12: Data Warehousing":
    - "Star Schema & ETL": modules/data-warehousing.md
    - "Week 10 Lecture: Star Schema Design": modules/week10-star-schema-lecture.md
    - "Week 10 Exercise": modules/week10-exercise.md
    - "📋 Kimball Cheat Sheet": modules/kimball-cheat-sheet.md
  - "Week 13-15: Spark & Hive":
    - "Apache Spark & Hive": modules/spark-hive.md
  - "Semester Project":
    - Project Specification: modules/project-spec.md
    - "Sample: BambooBudget": modules/project-sample.md
  - Lab Reference:
    - Schema & Dataset: modules/lab-schema.md
    - Lab Exercises: modules/lab-exercises.md
  - Contributing: contributing.md
