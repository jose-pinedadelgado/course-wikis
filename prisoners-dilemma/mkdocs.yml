site_name: "AI Prisoner's Dilemma — Research Wiki"
site_description: "Studying agent-to-agent cooperation and exploitation under game-theoretic conditions"
site_author: "Jose Pineda"

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: material/shield-sword
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Research:
    - Hypothesis & Motivation: research/hypothesis.md
    - Literature Review: research/literature.md
    - Experimental Phases: research/phases.md
    - Condition Matrix: research/conditions.md
    - Metrics & Analysis: research/metrics.md
  - Architecture:
    - System Overview: architecture/overview.md
    - Agent Design: architecture/agents.md
    - Protocol Validator: architecture/protocol.md
    - Game Engine: architecture/engine.md
  - Guides:
    - Getting Started: guides/quickstart.md
    - Running Experiments: guides/experiments.md
    - Adding Agents: guides/adding-agents.md
  - Reference:
    - CLI Reference: reference/cli.md
    - Configuration: reference/configuration.md
    - Data Formats: reference/data-formats.md
    - Payoff Matrix: reference/payoff.md
