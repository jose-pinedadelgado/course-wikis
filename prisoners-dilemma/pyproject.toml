[project]
name = "prisoners-dilemma-wiki"
version = "0.1.0"
description = "Research wiki for AI Agent Cooperation in Iterated Prisoner's Dilemma"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docs"]

[tool.uv]
dev-dependencies = [
    "mkdocs-material>=9.6",
]
