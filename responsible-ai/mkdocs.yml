site_name: "IS671 — Responsible AI"
site_description: "Course wiki for IS671 Responsible AI at CSULB"
site_author: "Jose Pineda"
site_url: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - "Ch 2: Fairness & Proxy Features":
    - Overview: modules/ch2-fairness/index.md
    - Fairness Concepts & Metrics: modules/ch2-fairness/fairness-concepts.md
    - Proxy Features: modules/ch2-fairness/proxy-features.md
  - "Ch 3: Bias in Data":
    - Bias Metrics: modules/ch3-bias/index.md
  - "Ch 4: Explainability":
    - Overview: modules/ch4-explainability/index.md
    - Feature Explanation: modules/ch4-explainability/feature-explanation.md
    - Model Explanation: modules/ch4-explainability/model-explanation.md
    - Explainable Models: modules/ch4-explainability/explainable-models.md
  - "Ch 5: Remove Bias from ML Model":
    - Overview: modules/ch5-remove-bias-model/index.md
    - Reweighting: modules/ch5-remove-bias-model/reweighting.md
    - Advanced Techniques: modules/ch5-remove-bias-model/advanced.md
  - "Ch 6: Remove Bias from ML Output":
    - Reject Option Classifier: modules/ch6-remove-bias-output/index.md
  - "Ch 7: Accountability in AI":
    - Overview: modules/ch7-accountability/index.md
    - Data Drift: modules/ch7-accountability/data-drift.md
    - Concept Drift: modules/ch7-accountability/concept-drift.md
  - "Ch 8: Data & Model Privacy":
    - Privacy Techniques: modules/ch8-privacy/index.md
  - Contributing: contributing.md
