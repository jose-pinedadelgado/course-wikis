site_name: "IS480 — Advanced Database Management"
site_description: "Course wiki for IS480 Advanced Database Management at CSULB"
site_author: "Jose Pineda"
site_url: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - "Week 1-2: Intro to Oracle PL/SQL":
    - Overview: modules/intro-plsql.md
    - Activity: modules/activity-intro-plsql.md
  - "Week 3: Logic & Conditionals":
    - Functions, Procedures & Conditionals: modules/functions-procedures.md
    - Activity: modules/activity-conditionals.md
  - "Week 4: SQL in PL/SQL":
    - SQL in PL/SQL: modules/sql-in-plsql.md
    - Exercises: modules/sql-in-plsql-exercises.md
  - "Week 5: Cursors":
    - PL/SQL Cursors: modules/cursors.md
    - Cursor Exercises: modules/cursor-exercises.md
  - Lab Reference:
    - Schema & Dataset: modules/lab-schema.md
    - Lab Exercises: modules/lab-exercises.md
  - Contributing: contributing.md
