site_name: "IS380 Exam Prep"
site_description: "IS380 preparation wiki for SQL, physical design, Big Data, NoSQL, DynamoDB, and Neo4j"
site_author: "Jose Pineda"
site_url: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Full Guide: full-guide.md
  - SQL:
    - Foundations: topics/sql-foundations.md
    - Advanced SQL: topics/advanced-sql.md
    - Query Recognition: topics/query-patterns.md
  - Physical Design: topics/physical-design.md
  - Big Data and NoSQL: topics/big-data-nosql.md
  - DynamoDB: topics/dynamodb.md
  - Neo4j and Cypher: topics/neo4j-cypher.md
  - Videos: videos.md
