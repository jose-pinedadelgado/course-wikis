[project]
name = "pacodogshop-wiki"
version = "0.1.0"
description = "Documentation for PacoDogShop — IS480 teaching database"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docs"]

[tool.uv]
dev-dependencies = [
    "mkdocs-material>=9.6",
]
