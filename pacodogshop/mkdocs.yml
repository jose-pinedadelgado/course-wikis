site_name: "PacoDogShop — Teaching Database"
site_description: "Dog fashion e-commerce database for IS480 Advanced Database Management"
site_author: "Jose Pineda"

theme:
  name: material
  palette:
    - scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: material/dog
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
    - Getting Started: guides/quickstart.md
    - Schema Overview: guides/schema.md
  - Reference:
    - Table Reference: reference/tables.md
    - Seed Data: reference/seed-data.md
    - Lab Exercises: reference/labs.md
