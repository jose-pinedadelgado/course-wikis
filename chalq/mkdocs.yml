site_name: "Chalq — Product Wiki"
site_description: "Convert course materials into beautiful, searchable wikis"
site_author: "Jose Pineda"

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: material/book-open-variant
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: guides/quickstart.md
    - CLI Reference: guides/cli.md
  - Architecture:
    - Three-Tier Model: architecture/three-tier.md
    - Input Sources: architecture/sources.md
    - File Converters: architecture/converters.md
    - Output Structure: architecture/output.md
  - Reference:
    - Cost Model: reference/cost-model.md
    - Supported Formats: reference/formats.md
    - Configuration: reference/configuration.md
  - Product:
    - Vision: product/vision.md
    - Roadmap: product/roadmap.md
    - Wikis Built: product/wikis-built.md
  - Contributing: contributing.md
