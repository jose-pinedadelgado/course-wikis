site_name: "Bamboo Money — Product Wiki"
site_description: "Documentation for Bamboo Money, a privacy-first personal finance app"
site_author: "Jose Pineda"
site_url: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: material/leaf
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: guides/quickstart.md
    - Installation: guides/installation.md
    - Demo Walkthrough: guides/demo-walkthrough.md
  - Features:
    - Overview: features/index.md
    - Dashboard: features/dashboard.md
    - Transactions: features/transactions.md
    - CSV Import & Export: features/csv-import-export.md
    - Budget Management: features/budgets.md
    - Budget Rollover: features/budget-rollover.md
    - Auto-Categorization Rules: features/categorization-rules.md
    - Spending Alerts: features/spending-alerts.md
    - Recurring Transaction Detection: features/recurring-detection.md
    - Cash Flow Forecast: features/cash-flow-forecast.md
    - Savings Goals: features/savings-goals.md
    - Net Worth Tracking: features/net-worth.md
    - Dark Mode: features/dark-mode.md
  - Architecture:
    - System Overview: architecture/overview.md
    - Data Model: architecture/data-model.md
    - Tech Stack: architecture/tech-stack.md
    - Security: architecture/security.md
  - Reference:
    - URL Routes: reference/urls.md
    - Management Commands: reference/commands.md
    - Bank CSV Formats: reference/csv-formats.md
    - Configuration: reference/configuration.md
  - Product:
    - Vision & Strategy: product/vision.md
    - Competitive Analysis: product/competitive-analysis.md
    - Roadmap: product/roadmap.md
    - User Stories: product/user-stories.md
  - Contributing: contributing.md
